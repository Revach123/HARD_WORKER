name: Change reports - page filter test

# בדיקה בלבד: מדגם דוחות רבעוניים שכבר חולצו, כל דוח פעמיים - כל העמודים מול עמודי השינוי בלבד - והשוואת אירועי
# השינוי שנמצאו והטוקנים. כותב רק ל-scripts/company_ownership/model_test/. ר' change_test.py.

on:
  workflow_dispatch:
    inputs:
      n:
        description: "מספר דוחות במדגם"
        required: false
        default: "15"
      thinking:
        description: "רמת חשיבה"
        type: choice
        options: [low, high]
        default: low
      prompt:
        description: "גרסת ההנחיה"
        type: choice
        options: [v2, v1]
        default: v2
      only_all:
        description: "רק כל העמודים (בלי סינון), לקבצים נפרדים לפי ההגדרה - להשוואה מול הריצה הקודמת"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: change-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PUSH_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install requests pypdf --break-system-packages
          sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Test
        working-directory: scripts/company_ownership
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_OVERRIDE: gemini-3.6-flash
          GEMINI_THINKING: ${{ github.event.inputs.thinking || 'low' }}
          GEMINI_RPM: "300"
          GEMINI_CHUNK: "1"
          EXTRACTION_PROMPT: ${{ github.event.inputs.prompt || 'v2' }}
          CHG_PHASES: ${{ github.event.inputs.only_all == 'true' && 'all' || 'all,filtered' }}
          CHG_TAG: ${{ github.event.inputs.only_all == 'true' && format('{0}{1}', github.event.inputs.prompt, github.event.inputs.thinking) || '' }}
          PYTHONUNBUFFERED: "1"
        run: python change_test.py "${{ github.event.inputs.n || '15' }}"
      - name: Commit test output
        if: always()
        working-directory: scripts/company_ownership
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d model_test ] || exit 0
          git add model_test
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "change test [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main; git rebase origin/main || git rebase --abort
            sleep $((i * 3))
          done
          exit 1
