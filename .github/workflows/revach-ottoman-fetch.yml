# Ottoman associations and public hekdeshot from GuideStar ->
# Revach data/registry/ottoman_associations.json, data/registry/hekdeshot.json
# Runs here (public repo = free Actions minutes) against a checkout of Revach.
# Secrets in THIS repo: REVACH_TOKEN.
name: Revach - Ottoman associations, hekdeshot and PBCs (GuideStar)

on:
  workflow_dispatch: {}

concurrency:
  group: revach-ottoman-fetch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Revach123/Revach
          token: ${{ secrets.REVACH_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/registry
            data/registry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python -u scripts/registry/fetch_guidestar.py ottoman
      - run: python -u scripts/registry/fetch_guidestar.py hekdesh
      - run: python -u scripts/registry/fetch_guidestar.py pbc

      - name: Commit to Revach
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry/ottoman_associations.json data/registry/hekdeshot.json data/registry/pbc_companies.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Ottoman associations and hekdeshot from GuideStar ($(date -u +%Y-%m-%d)) (via HARD_WORKER)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          echo "::error::push failed"; exit 1
