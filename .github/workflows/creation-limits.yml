name: creation-limits (ק79)
on:
  # יומי, לפני build-funds באתר (04:30 UTC), שמושך את ה-CSV מכאן. בריצה מתוזמנת
  # inputs ריק -> מצב build. המטמונים (k79/k121) מורידים רק דוחות חדשים.
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "discover = שמירת דוגמאות לבדיקה בלבד; build = משיכה מלאה ל-CSV"
        required: true
        default: discover
        type: choice
        options: [discover, build, probe, probe2, texts, fund]
      ids:
        description: "texts: מזהי דוחות מופרדים ברווח"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: creation-limits
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf pypdfium2
      - name: Run
        run: |
          set -o pipefail
          mkdir -p data/funds_info/_debug
          if [ "${{ inputs.mode }}" = "fund" ]; then
            python -u scripts/funds_info/fund_probe.py ${{ inputs.ids }} 2>&1 | tee data/funds_info/_debug/run.log
          elif [ "${{ inputs.mode }}" = "texts" ]; then
            python -u scripts/funds_info/creation_limits_texts.py ${{ inputs.ids }} 2>&1 | tee data/funds_info/_debug/run.log
          elif [ "${{ inputs.mode }}" = "probe2" ]; then
            python -u scripts/funds_info/creation_limits_probe2.py 2>&1 | tee data/funds_info/_debug/run.log
          elif [ "${{ inputs.mode }}" = "probe" ]; then
            python -u scripts/funds_info/creation_limits_probe.py 2>&1 | tee data/funds_info/_debug/run.log
          else
            ARG=""; [ "${{ inputs.mode }}" = "discover" ] && ARG="--discover"
            python -u scripts/funds_info/creation_limits.py $ARG 2>&1 | tee data/funds_info/_debug/run.log
          fi
      - name: Commit outputs
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/funds_info/_debug data/funds_info/creation_limits.csv data/funds_info/k79_cache.json data/funds_info/k121_cache.json; do
            [ -e "$f" ] && git add -A "$f"
          done
          if git diff --staged --quiet; then echo "אין שינויים"; exit 0; fi
          git commit -m "auto: creation limits (${{ inputs.mode || 'build' }}) [skip ci]"
          # בזמן ריצת חילוץ החברות (RUNNING_LOCK ב-main) לא דוחפים ל-main: הרצות בדיקה
          # נדחפות לענף נפרד creation-limits-debug מיד; build ממתין עד 10 דקות ואז מדלג
          # (ה-CSV יתעדכן בריצה הבאה).
          locked() { git fetch -q origin main; git cat-file -e origin/main:scripts/company_ownership/RUNNING_LOCK 2>/dev/null; }
          if [ "${{ inputs.mode || 'build' }}" != "build" ] && locked; then
            echo "RUNNING_LOCK קיים - דוחף לענף creation-limits-debug"
            git push -f origin HEAD:refs/heads/creation-limits-debug && exit 0
            exit 1
          fi
          for w in $(seq 1 10); do
            locked || break
            echo "RUNNING_LOCK קיים ב-main - ממתין 60s ($w)"; sleep 60
          done
          locked && { echo "הלוק לא שוחרר - מדלג על push"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push && exit 0
            sleep 3
          done
          exit 1
