# Load Ottoman associations and public hekdeshot (GuideStar files in Revach)
# into company-info-db (associations table) - only numbers not already there.
# Runs here (public repo = free Actions minutes) against a checkout of Revach.
# Secrets in THIS repo: REVACH_TOKEN, CF_D1_TOKEN, CF_ACCOUNT_ID.
name: Revach - load GuideStar lists into the registry DB

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "count only, write nothing"
        type: boolean
        default: true

concurrency:
  group: revach-guidestar-load
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Revach123/Revach
          token: ${{ secrets.REVACH_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/registry
            data/registry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load
        working-directory: scripts/registry
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CF_DATABASE_ID: c1d082fc-c125-4f62-8b33-9b62d5bda2da   # company-info-db (public, in HARAV_LEVIN wrangler.toml)
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          ln -sfn "$GITHUB_WORKSPACE/data" data
          python -u load_guidestar.py
