# Runs here (public repo = free Actions minutes) against a checkout of the
# private Revach repo; results are pushed back to Revach.
# Secrets in THIS repo: REVACH_TOKEN, COMPANIES_HOUSE_API_KEY.
name: "Revach - Foreign subsidiaries (GLEIF + Companies House)"

# חברות בת שחולצו מדוחות ולא נמצאו ברשם הישראלי (בעיקר זרות): זיהוי ואימות במרשמים הזרים.
# ר' scripts/company_ownership/enrich_foreign_subsidiaries.py ב-Revach.
# ההרצה הראשונה ארוכה (~2-3 שעות, GLEIF מוגבל ל-60 בקשות לדקה); אחריה רק מה שלא נבדק 30 יום.
# ריצה שנקטעה ממשיכה מהמטמון (נשמר גם בכשל).

on:
  schedule:
    - cron: "20 4 * * 0"   # weekly, Sunday 04:20 UTC
  workflow_dispatch: {}

concurrency:
  group: revach-foreign-subsidiaries
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash /tmp/q.sh {0}
    timeout-minutes: 300
    steps:
      - name: Quiet logs (public repo - full output stays hidden)
        shell: bash
        run: |
          cat > /tmp/q.sh <<'Q'
          #!/bin/bash
          # מריץ את שלב ה-workflow ושומר את הפלט בקובץ: בהצלחה - רק "ok"; בכשל - 15 השורות האחרונות בלבד
          log=$(mktemp)
          bash --noprofile --norc -eo pipefail "$1" >"$log" 2>&1; c=$?
          if [ $c -eq 0 ]; then echo "ok ($(wc -l <"$log") log lines hidden)"; else echo "failed (exit $c) - last lines:"; tail -n 15 "$log"; fi
          exit $c
          Q
      - uses: actions/checkout@v5
        with:
          repository: Revach123/Revach
          token: ${{ secrets.REVACH_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Enrich foreign subsidiaries
        timeout-minutes: 280
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/company_ownership/enrich_foreign_subsidiaries.py
      - name: Commit data
        if: always()   # גם אם ההרצה נקטעה - שומרים את המטמון החלקי (המשך מאותה נקודה בריצה הבאה)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/holdings/foreign_subsidiaries.json data/holdings/foreign_subsidiaries_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "foreign-subsidiaries $(date -u +%Y-%m-%d) (via HARD_WORKER)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::push failed"; exit 1
