name: A/B test fixed pipeline (no writes to real data)

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas pypdf --break-system-packages

      - name: Run A/B test
        working-directory: scripts/company_ownership
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          PYTHONUNBUFFERED: "1"
        run: python test_fixed_pipeline.py

      - name: Commit results
        if: always()
        working-directory: scripts/company_ownership
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ab_test_results.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "אין שינויים לחיוב."
          else
            git commit -m "A/B test results: fixed pipeline vs diagnose baseline [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "push הצליח (ניסיון $i)."
                break
              fi
              echo "push נדחה (ניסיון $i/5) - מושך ועושה rebase..."
              git pull --rebase origin main
            done
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-test-results
          path: scripts/company_ownership/ab_test_results.json
          retention-days: 30
