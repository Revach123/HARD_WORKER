# Freshness check of the corporate registry lists in company-info-db (companies, partnerships, associations, cooperatives, Ottoman,
# hekdeshot, parties) - read-only, daily. For each list: when its load last finished successfully (app_meta "last_load:<name>"; falls back
# to the last changed row). A list not loaded for over two weeks -> a designed alert e-mail (red sign) to the owner. Manual run with
# send_always sends the full report even when everything is fresh. Script: Revach scripts/registry/registry_freshness.py.
# Secrets in THIS repo: REVACH_TOKEN, CF_D1_TOKEN, CF_ACCOUNT_ID, MAIL_SCRIPT_SECRET, ALERT_EMAIL.
name: Revach - registry freshness

on:
  schedule:
    - cron: "20 5 * * *"   # daily 05:20 UTC
  workflow_dispatch:
    inputs:
      send_always:
        description: "send the full report e-mail even if everything is fresh (test)"
        type: boolean
        default: false

concurrency:
  group: revach-registry-freshness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash /tmp/q.sh {0}
    timeout-minutes: 10
    steps:
      - name: Quiet logs (public repo - full output stays hidden)
        shell: bash
        run: |
          cat > /tmp/q.sh <<'Q'
          #!/bin/bash
          # runs the step and keeps its output in a file: on success only "ok"; on failure only the last 15 lines
          log=$(mktemp)
          bash --noprofile --norc -eo pipefail "$1" >"$log" 2>&1; c=$?
          if [ $c -eq 0 ]; then echo "ok ($(wc -l <"$log") log lines hidden)"; else echo "failed (exit $c) - last lines:"; tail -n 15 "$log"; fi
          exit $c
          Q
      - uses: actions/checkout@v5
        with:
          repository: Revach123/Revach
          token: ${{ secrets.REVACH_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/registry

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check freshness
        working-directory: scripts/registry
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CF_DATABASE_ID: c1d082fc-c125-4f62-8b33-9b62d5bda2da   # company-info-db (public, in HARAV_LEVIN wrangler.toml)
          SEND_ALWAYS: ${{ inputs.send_always && '1' || '' }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          MAIL_SCRIPT_SECRET: ${{ secrets.MAIL_SCRIPT_SECRET }}
        run: python -u registry_freshness.py
