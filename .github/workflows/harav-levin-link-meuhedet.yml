# One-off: link HARAV_LEVIN's "קופת חולים מאוחדת" (stored as 5849/99, its old
# Ottoman association number) to its registry number 589958495 (GuideStar /
# company-info-db). Changes exactly one row in business-registry-db.businesses,
# and only if exactly one row matches both the old number and the name.
# Secrets in THIS repo: CF_D1_TOKEN, CF_ACCOUNT_ID.
name: HARAV_LEVIN - link Meuhedet to registry number

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "write the change (otherwise only show the row)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Link
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          DB_ID: 61e1a52e-1083-478d-914c-5375d8ed59bb   # business-registry-db (HARAV_LEVIN wrangler.toml, binding DB)
          APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          URL = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}/d1/database/{os.environ['DB_ID']}/query"
          def q(sql, params=None):
              req = urllib.request.Request(URL, data=json.dumps({"sql": sql, "params": params or []}).encode(), method="POST",
                                           headers={"Authorization": f"Bearer {os.environ['CF_D1_TOKEN']}", "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  res = json.load(r)
              assert res.get("success"), res.get("errors")
              return res["result"][0]
          OLD, NEW, NAME = "5849/99", "589958495", "קופת חולים מאוחדת"
          cols = "id, chp_number, permit_name, registrar_name, registry_status"
          rows = q(f"SELECT {cols} FROM businesses WHERE TRIM(chp_number) = ?", [OLD])["results"]
          print("rows with", OLD, ":", json.dumps(rows, ensure_ascii=False))
          clash = q(f"SELECT {cols} FROM businesses WHERE TRIM(chp_number) = ?", [NEW])["results"]
          print("rows already with", NEW, ":", json.dumps(clash, ensure_ascii=False))
          if len(rows) != 1 or rows[0]["permit_name"].strip() != NAME:
              raise SystemExit("expected exactly one row with that number and name - not changing anything")
          if os.environ["APPLY"] != "1":
              print("dry run - nothing written"); raise SystemExit(0)
          res = q("UPDATE businesses SET chp_number = ? WHERE id = ? AND TRIM(chp_number) = ? AND TRIM(permit_name) = ?",
                  [NEW, rows[0]["id"], OLD, NAME])
          print("changed rows:", res.get("meta", {}).get("changes"))
          print("after:", json.dumps(q(f"SELECT {cols} FROM businesses WHERE id = ?", [rows[0]["id"]])["results"], ensure_ascii=False))
          EOF
