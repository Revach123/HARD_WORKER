# ריצה חד-פעמית: שליפת שורות פיקדון/מזומן (סוג נכס 100/101/103/105) מכל
# הדוחות החודשיים של קרנות הנאמנות והסל ב-Maya, כולל היסטוריה.
# רץ אוטומטית ב-push לענף claude/fund-deposits-oneoff ושומר את הפלט חזרה
# לאותו ענף (data/fund_deposits/). לא נוגע ב-main.
name: Fund deposits - one-off pull

on:
  push:
    branches: [claude/fund-deposits-oneoff]
    paths: [scripts/fund_deposits/**, .github/workflows/fund-deposits-oneoff.yml]
  workflow_dispatch:
    inputs:
      months_back:
        description: "כמה חודשים אחורה"
        required: false
        default: "24"

permissions:
  contents: write

concurrency:
  group: fund-deposits-oneoff
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Pull deposit rows from Maya
        env:
          MONTHS_BACK: ${{ github.event.inputs.months_back || '24' }}
        run: python scripts/fund_deposits/pull_deposits.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fund_deposits || true
          git diff --cached --quiet && exit 0
          git commit -m "fund deposits: one-off pull results [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
