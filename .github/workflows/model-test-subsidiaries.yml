name: Model test - subsidiary extraction

# ניסוי השוואת מודלים לחילוץ חברות הבת, על חברות נבחרות. כותב רק ל-scripts/company_ownership/model_test/
# (private_subsidiaries.jsonl, processed_reports ו-D1 לא משתנים). ר' model_test_extract.py.

on:
  workflow_dispatch:
    inputs:
      cids:
        description: "companyId של מאיה (מופרדים בפסיק)"
        required: true
        default: "1172,1630,127,691,1068,1095"
      model:
        description: "מודל Gemini (שם מדויק)"
        required: true
        default: gemini-3.6-flash
      thinking:
        description: "רמת חשיבה"
        type: choice
        options: [high, low]
        default: high
      chunk:
        description: "חלונות של 20 עמודים (כמו flash-lite בייצור) גם למודל הזה"
        type: boolean
        default: false
      page_filter:
        description: "סינון עמודים: none / relevant (טבלאות ותרשימים) / charts (רק תרשימי מבנה - למודל יקר)"
        type: choice
        options: [none, relevant, charts]
        default: none
      dry:
        description: "בלי Gemini - רק בדיקת סינון העמודים (כמה נבחרו, כמה מחברות הבת הקיימות מכוסות)"
        type: boolean
        default: false
      probe:
        description: "בלי Gemini: טווח עמודים (למשל 10-16) - טקסט pdftotext ומניין שמות ישויות"
        required: false
        default: ""
      chart_model:
        description: "מודל לעמודי תרשים מבנה שהם תמונה (OCR), בנוסף - למשל gemini-4-hydrogen; ריק = בלי"
        required: false
        default: ""
      ocr_test:
        description: "cid:file:from-to (למשל 1630:1:10-16) - אותם עמודים בלי / עם OCR כרמז"
        required: false
        default: ""
      prompt:
        description: "גרסת ההנחיה לג'מיני (v1 = הייצור, v2 = סוג ישות / נכסים, שמות מלאים, בלי סעיפים לא רלוונטיים)"
        type: choice
        options: [v1, v2]
        default: v1

permissions:
  contents: write

concurrency:
  group: model-test-${{ github.event.inputs.model }}-${{ github.event.inputs.thinking }}-${{ github.event.inputs.chunk }}-${{ github.event.inputs.page_filter }}-${{ github.event.inputs.chart_model }}-${{ github.event.inputs.prompt }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PUSH_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install requests pypdf --break-system-packages
          sudo apt-get install -y -qq poppler-utils >/dev/null
          if [ -n "${{ github.event.inputs.probe }}${{ github.event.inputs.ocr_test }}" ] || [ "${{ github.event.inputs.page_filter }}" = "charts" ] || [ -n "${{ github.event.inputs.chart_model }}" ]; then sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-heb >/dev/null; fi
      - name: Extract (test)
        working-directory: scripts/company_ownership
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_OVERRIDE: ${{ github.event.inputs.model }}
          GEMINI_THINKING: ${{ github.event.inputs.thinking }}
          GEMINI_RPM: "300"
          EXTRACTION_PROMPT: ${{ github.event.inputs.prompt || 'v1' }}
          GEMINI_CHART_MODEL: ${{ github.event.inputs.chart_model }}
          PROBE_DUMP: ${{ github.event.inputs.probe != '' && '1' || '0' }}
          GEMINI_CHUNK: ${{ github.event.inputs.chunk == 'true' && '1' || '0' }}
          GEMINI_PAGE_FILTER: ${{ github.event.inputs.page_filter == 'relevant' && '1' || github.event.inputs.page_filter == 'charts' && 'charts' || '0' }}
          PYTHONUNBUFFERED: "1"
        run: python model_test_extract.py --cids "${{ github.event.inputs.cids }}" --workers 6 ${{ github.event.inputs.dry == 'true' && '--dry' || '' }} ${{ github.event.inputs.probe != '' && format('--probe {0}', github.event.inputs.probe) || '' }} ${{ github.event.inputs.ocr_test != '' && format('--ocr-test {0}', github.event.inputs.ocr_test) || '' }}
      - name: Commit test output
        if: always()
        working-directory: scripts/company_ownership
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d model_test ] || exit 0
          git add model_test
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "model test: ${{ github.event.inputs.model }} ${{ github.event.inputs.thinking }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main; git rebase origin/main || git rebase --abort
            sleep $((i * 3))
          done
          exit 1
