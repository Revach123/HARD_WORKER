name: legal probe (one-off, dev branch only)

# בדיקה חד-פעמית: מקורות חוקיים על יצירה/פדיון בקרנות סל ובקרן הטכנולוגיה העילית -> data/legal_probe
on:
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/legal-probe.yml
      - scripts/legal_probe/**

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - run: python -u scripts/legal_probe/fetch_legal.py
        env:
          ONLY: amendment28_2017_pdf,knesset_2018_isa_version_pdf
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/legal_probe
          git diff --cached --quiet && exit 0
          git commit -q -m "legal probe output [skip ci]"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
