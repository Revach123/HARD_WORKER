# .github/workflows/debug-search-probe.yml
#
# זמני - אבחון בלבד. מריץ את match_exact/match_fuzzy (בדיוק כמו match_subsidiary_names.py
# בפרודקשן) נגד שתי השאילתות שנכשלו כל יום ב-500 מ-/api/search
# ("מודיעין אנרגיה אינטרנשיונל", "ראקוטו דיפלומט אינטרנשיונל"), כדי לאמת
# בפועל שהתיקון ב-Revach123/Revach#68 (שמוזג ל-main) פתר את הבעיה בלי
# לחכות לריצה היומית הבאה. למחוק אחרי שהאימות הושלם.

name: Debug - search probe (temporary)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests --break-system-packages
      - name: Probe previously-failing search queries
        working-directory: scripts/company_ownership
        env:
          MATCH_KEY: ${{ secrets.MATCH_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PYEOF'
          from match_subsidiary_names import match_exact, match_fuzzy, SearchTemporaryError

          names = [
              "מודיעין אנרגיה אינטרנשיונל - שותפות כללית",
              "ראקוטו דיפלומט אינטרנשיונל שותפות מוגבלת",
          ]
          for n in names:
              print(f"\n=== {n!r} ===")
              try:
                  print("exact ->", match_exact(n))
              except SearchTemporaryError as e:
                  print("exact FAILED:", e)
              try:
                  print("fuzzy ->", match_fuzzy(n))
              except SearchTemporaryError as e:
                  print("fuzzy FAILED:", e)
          PYEOF
