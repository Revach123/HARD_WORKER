# One-off check (manual, read-only on the DB): which public hekdeshot sit in company-info-db (category "הקדש ציבורי") but are NOT in the official
# Registrar of Hekdeshot list (data.gov.il, "מידע כללי", active hekdeshot only)? For each one: its DB row (name / status / registration date / last update)
# and whether it appears in the other official hekdeshot tables (land / asset balance) - i.e. is it really gone from the registry?
# Writes the result to Revach (private) data/probe/hekdeshot_not_in_official.json - nothing is printed to this public log.
name: Revach - hekdeshot not in official list (check)

on:
  workflow_dispatch: {}

concurrency:
  group: revach-hekdeshot-stale
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Revach123/Revach
          token: ${{ secrets.REVACH_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check (output stays out of the public log)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CF_DATABASE_ID: c1d082fc-c125-4f62-8b33-9b62d5bda2da
        run: |
          python3 - >/dev/null <<'PY'
          import json, os, re, urllib.request, urllib.parse
          H = {"User-Agent": "Mozilla/5.0", "Referer": "https://data.gov.il/"}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=120) as r:
                  return json.loads(r.read().decode("utf-8"))
          def d1(sql):
              u = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}/d1/database/{os.environ['CF_DATABASE_ID']}/query"
              req = urllib.request.Request(u, data=json.dumps({"sql": sql}).encode(), headers={"Authorization": "Bearer " + os.environ["CF_D1_TOKEN"], "Content-Type": "application/json"})
              return json.loads(urllib.request.urlopen(req, timeout=120).read())["result"][0]["results"]
          CK = "https://data.gov.il/api/3/action/"
          pkg = get(CK + "package_show?id=hekdeshot")["result"]
          def all_records(rid):
              out, off = [], 0
              while True:
                  r = get(CK + "datastore_search?" + urllib.parse.urlencode({"resource_id": rid, "limit": 5000, "offset": off}))["result"]
                  out += r["records"]; off += len(r["records"])
                  if not r["records"] or off >= int(r["total"]): return out, [f["id"] for f in r.get("fields", [])]
          tables = {}
          for res in pkg["resources"]:
              if res.get("datastore_active"):
                  recs, fields = all_records(res["id"])
                  tables[res["name"]] = (recs, fields)
          digits = lambda v: re.sub(r"\D", "", str(v or ""))
          general = next(v for k, v in tables.items() if "מידע כללי" in k)[0]
          off_ids = {digits(x.get("מספר תיק")) for x in general}
          other = {}
          for name, (recs, fields) in tables.items():
              if "מידע כללי" in name: continue
              idf = next((f for f in fields if "מספר" in f and "תיק" in f), None) or next((f for f in fields if "מספר" in f), None)
              other[name] = {digits(x.get(idf)) for x in recs} if idf else set()
          rows = d1("SELECT id, name, status, reg_date, purpose, updated_at FROM associations WHERE category = 'הקדש ציבורי'")
          missing = [r for r in rows if digits(r["id"]) not in off_ids]
          # השורות של כל הקדש חסר בטבלאות האחרות (עד 4 לכל טבלה) + שמות השדות - כדי לראות שנים / תאריכים (עדכני או היסטורי)
          detail = {}
          for name, (recs, fields) in tables.items():
              if "מידע כללי" in name: continue
              idf = next((f for f in fields if "מספר" in f and "תיק" in f), None) or next((f for f in fields if "מספר" in f), None)
              hits = {}
              for x in recs:
                  k = digits(x.get(idf)) if idf else ""
                  if k in {digits(r["id"]) for r in missing}:
                      hits.setdefault(k, []).append({f: x.get(f) for f in fields if f != "_id"})
              detail[name] = {"fields": fields, "rows": {k: v[:4] for k, v in hits.items()},
                              "years_in_table": sorted({str(x.get(f))[:4] for x in recs for f in fields if "שנ" in f or "תאריך" in f})[-6:]}
          out = {"db_hekdeshot": len(rows), "official_general": len(off_ids), "official_general_records": len(general), "not_in_official": len(missing), "other_tables_detail": detail,
                 "other_official_tables": {k: len(v) for k, v in other.items()},
                 "rows": [{**r, "in_other_official_tables": [k for k, v in other.items() if digits(r["id"]) in v]} for r in missing]}
          os.makedirs("data/probe", exist_ok=True)
          json.dump(out, open("data/probe/hekdeshot_not_in_official.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
      - name: Save result to Revach
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe/hekdeshot_not_in_official.json
          git diff --staged --quiet || (git commit -q -m "probe: hekdeshot not in official list (via HARD_WORKER)" && for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done)
