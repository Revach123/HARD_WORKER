# Daily, free check for new ת077 reports (public repo = free Actions minutes).
# Reads only the Maya feed - no reports are downloaded and no ID numbers are
# touched. If new reports exist, triggers the Revach pipeline (private repo,
# billed minutes) via repository_dispatch; otherwise does nothing.
# Secrets in THIS repo: REVACH_TOKEN (Revach, Contents: Read and write).
name: Revach - ת077 check (triggers pipeline)

on:
  schedule:
    - cron: "40 4 * * *"   # daily 04:40 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "trigger the pipeline even with no new reports"
        type: boolean
        default: false

concurrency:
  group: revach-t077-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Revach123/Revach
          token: ${{ secrets.REVACH_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            /scripts/company_ownership/
            /data/holdings/t077-index.json
            /requirements.txt
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Check feed
        id: check
        working-directory: scripts/company_ownership
        run: python t077_check_new.py

      - name: Trigger Revach pipeline
        if: steps.check.outputs.new != '0' || inputs.force
        env:
          T: ${{ secrets.REVACH_TOKEN }}
          N: ${{ steps.check.outputs.new }}
        run: |
          code=$(curl -s -o /tmp/resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Revach123/Revach/dispatches \
            -d "{\"event_type\":\"t077-new\",\"client_payload\":{\"new\":\"$N\"}}")
          echo "HTTP $code"; cat /tmp/resp
          [ "$code" = "204" ] || { echo "::error::dispatch failed"; exit 1; }
          echo "Triggered Revach pipeline ($N new reports)."
