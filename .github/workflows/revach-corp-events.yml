# Revach corp events - runs here (public repo = free Actions minutes) against a
# checkout of the private Revach repo. The code stays in Revach
# (scripts/company_ownership/corp_events.py, capital_events.py); only the run
# happens here. Results are pushed back to Revach main.
#
#   daily (schedule) : mergers ת062, exits ת103, name changes ת101, offerings ת020
#                      (incremental) + material capital events ת087 (forward only)
#   manual (dispatch): any mode - long backfills, rebuilds
#
# Gemini: only capital_events.py, only for candidates found by the structured-field
# filter, ONE key (GEMINI_API_KEY - no key rotation), at most AI_MAX requests per run,
# a pause between requests, stops on quota/permission errors.
#
# Secrets/vars in THIS repo:
#   REVACH_TOKEN                 - Revach, Contents: Read and write (exists)
#   CF_D1_TOKEN, CF_ACCOUNT_ID   - Cloudflare D1 (exist) - merger targets matched by name in the registry
#   GEMINI_API_KEY               - exists
#   vars.CF_DATABASE_ID          - company-info-db id (same as the Revach variable). Optional:
#                                  without it the registry name match is skipped.
name: Revach - Corp events (mergers, exits, names, offerings, capital)

on:
  schedule:
    # 08:15 UTC: מכסת Gemini היומית מתאפסת בחצות שעון פסיפיק (08:00 UTC), וחילוץ חברות הבת (אותו מפתח)
    # מתחיל ב-09:05 - שלב הפרשנות רץ ראשון בריצה, לפני שהמכסה מנוצלת
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "all = daily | offerings-monthly / capital = backfills | build = rebuild outputs from the indexes, no download"
        type: choice
        default: all
        options: [all, build, capital, capital-ai, offerings, offerings-monthly,
                  exits, names, names-rebuild, names-context]

concurrency:
  group: revach-corp-events
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash /tmp/q.sh {0}
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Quiet logs (public repo - full output stays hidden)
        shell: bash
        run: |
          cat > /tmp/q.sh <<'Q'
          #!/bin/bash
          # מריץ את שלב ה-workflow ושומר את הפלט בקובץ: בהצלחה - רק "ok"; בכשל - 15 השורות האחרונות בלבד
          log=$(mktemp)
          bash --noprofile --norc -eo pipefail "$1" >"$log" 2>&1; c=$?
          if [ $c -eq 0 ]; then echo "ok ($(wc -l <"$log") log lines hidden)"; else echo "failed (exit $c) - last lines:"; tail -n 15 "$log"; fi
          exit $c
          Q

      - name: Check token
        env:
          T: ${{ secrets.REVACH_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "::error::REVACH_TOKEN secret is missing in HARD_WORKER"; exit 1; fi

      - uses: actions/checkout@v5
        with:
          repository: Revach123/Revach
          token: ${{ secrets.REVACH_TOKEN }}
          sparse-checkout: |
            scripts
            data/corp_events
            data/registry
            data/holdings
            requirements.txt
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Run
        working-directory: scripts/company_ownership
        env:
          MODE: ${{ inputs.mode || 'all' }}
          SINCE_YEAR: "2000"
          CI: "true"
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID || secrets.CF_DATABASE_ID }}   # משתנה גלוי או סוד - מה שהוגדר
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_MAX: "25"
        run: |
          # שלבי האיסוף רק מוסיפים דוחות לאינדקסים (SKIP_BUILD=1); כל קובצי התוצר נבנים פעם אחת בסוף (corp_events build)
          export SKIP_BUILD=1
          case "$MODE" in
            all)
              if [ -f ../../data/corp_events/t087-index.json ]; then python capital_events.py ai; fi
              python corp_events.py all
              if [ -f ../../data/corp_events/t087-index.json ]; then MAX_MINUTES=30 python capital_events.py forward; fi ;;
            capital)    python capital_events.py all ;;
            capital-ai) python capital_events.py ai ;;
            build)      ;;
            *)          python corp_events.py "$MODE" ;;
          esac
          SKIP_BUILD=0 python corp_events.py build

      - name: Commit to Revach
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/corp_events data/registry/company_names_history.json; do
            if [ -e "$f" ]; then git add -A "$f"; fi
          done
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "corp-events: ${{ inputs.mode || 'all' }} $(date -u +%Y-%m-%d) (via HARD_WORKER)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "::error::Failed to push after 5 attempts."; exit 1
