# .github/workflows/test-small-batch.yml
#
# report_selector.py + run_full_batch.py. רץ על שרתי GitHub.
#
# התמדה: לא מסתמכים על actions/cache יותר (התברר שהוא branch-scoped -
# cache שנוצר על branch אחד לא נגיש מ-branch אחר, וזה איבד לנו נתונים
# פעם אחת כבר). כל ההתקדמות נשמרת ישירות ב-git (commit+push בסוף כל
# הרצה): .maya_cache/*_merged.json (דוחות שכבר נשלפו מ-Maya, לפי
# manifest של חלונות-תאריכים), selection_plan.json, processed_reports.json,
# private_subsidiaries.jsonl. כל הרצה מתחילה מ-checkout רגיל של main -
# הקבצים כבר שם, בלי שום שחזור cache נפרד.
#
# שני מנגנוני הפעלה:
# 1. workflow_dispatch - הפעלה ידנית עם שליטה על כל הפרמטרים.
# 2. schedule (cron) - הפעלה אוטומטית כל 6 שעות, כדי להמשיך לעבד את
#    התור הנותר בלי התערבות ידנית (GitHub Actions מגביל כל job ל-6
#    שעות קשיח - זה עוקף את הצורך להריץ ידנית שוב ושוב).
# מאחר ש-schedule events אינם כוללים github.event.inputs, כל הפרמטרים
# למטה משתמשים ב-fallback (||) לברירת מחדל קבועה כשאין קלט ידני.
#
# כשמגיעים למכסה (מסודר: TPM זמני מטופל אוטומטית, רק RPD אמיתי עוצר),
# ההרצה נעצרת בעדינות - ההרצה הבאה (ידנית או מתוזמנת) ממשיכה מאותה
# נקודה בדיוק, כי הכל כבר ב-git.

name: Subsidiary extraction - full batch (resumable)

permissions:
  contents: write  # נדרש כדי ש-git push יעבוד בסוף כל הרצה

# מונע הרצות חופפות: אם הרצה כבר פעילה (יכולה לקחת עד 350 דקות) ומישהו
# מפעיל הרצה נוספת, הריצה החדשה תמתין בתור במקום לרוץ במקביל ולהתנגש
# עם ה-push בסוף. זה מה שגרם ל"cannot lock ref" - שתי הרצות דחפו כמעט
# בו-זמנית ל-main. cancel-in-progress: false כי לא רוצים לבטל הרצה
# שכבר עיבדה שעות של נתונים - רק לתזמן את הבאה אחריה.
concurrency:
  group: subsidiary-extraction-main
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "טווח - מתאריך (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"
      to_date:
        description: "טווח - עד תאריך (YYYY-MM-DD) - מוגבל אוטומטית ל'אתמול'"
        required: true
        default: "2026-12-31"
      limit:
        description: "הגבלת מספר משימות לעיבוד (ריק = הכל, עד המכסה)"
        required: false
        default: ""
      workers:
        description: "כמה משימות מקביליות - זהירות: יותר מדי workers עם קבצי PDF גדולים עלול לחצות TPM שוב ושוב ולבזבז RPD אמיתי על ניסיונות כושלים (נצפה בפועל)"
        required: false
        default: "2"
      skip_maya_refetch:
        description: "דלג לגמרי על שלב שליפת Maya - להשתמש ב-selection_plan.json הקיים כמו שהוא"
        required: false
        default: "false"
      model:
        description: "איזה מודל Gemini - כל אחד עוקב מכסה ו-processed_reports נפרדים, לא חוסמים זה את זה"
        required: false
        type: choice
        options:
          - gemini-3.6-flash
          - gemini-3.5-flash-lite
        default: gemini-3.6-flash
  # ריצה אוטומטית יומית פעמיים - שתי שעות שונות, שני מודלים שונים
  # (אושר 2026-09-02 - הרגרסיה שתועדה למטה נבדקה ואושרה כפתורה).
  # schedule events לא כוללים github.event.inputs, אז הבחירה בין
  # המודלים למטה (ב-env GEMINI_MODEL_OVERRIDE) מתבססת על github.event.schedule
  # (מחרוזת ה-cron שהפעילה את הריצה הספציפית הזו), לא על input.
  schedule:
    # כל יום 11:00 שעון ישראל (08:00 UTC בקיץ) - gemini-3.6-flash
    - cron: "0 8 * * *"
    # כל יום 13:00 שעון ישראל (10:00 UTC בקיץ) - gemini-3.5-flash-lite
    - cron: "0 10 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    # 350 לא 360 - משאיר מרווח ביטחון של 10 דקות לפני הקטיעה הקשיחה של
    # GitHub (360 = מקסימום מוחלט, לא ניתן להגדלה), כדי ששלב ה-commit
    # הסופי (if: always()) יקבל סיכוי טוב לרוץ נקי לפני שהריצה נקטעת.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pypdf --break-system-packages

      # לוק ריצה בפועל - נדחף מיד ל-git, לא רק state פנימי של ה-job.
      # למה: concurrency (למעלה) מונע רק חפיפה בין הרצות workflow -
      # לא מגן מפני push ידני חיצוני (כולל שלי - זה בדיוק מה שקרה
      # ב-2026-09-02: מחקתי קבצים דרך ה-API תוך כדי שריצה כאן הייתה
      # באמצע commit, ותקעתי את שתיהן). לפני כל push ידני ל-repo הזה,
      # לבדוק קודם שקובץ RUNNING_LOCK הזה לא קיים ב-main.
      - name: Create run lock
        working-directory: scripts/company_ownership
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "run_id=${{ github.run_id }}" > RUNNING_LOCK
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> RUNNING_LOCK
          git add RUNNING_LOCK
          git commit -m "Lock: run ${{ github.run_id }} started [skip ci]"
          for i in 1 2 3; do
            git push && break
            git fetch origin main && git rebase origin/main || git rebase --abort
          done

      - name: Build report selection plan
        if: github.event.inputs.skip_maya_refetch != 'true'
        working-directory: scripts/company_ownership
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python report_selector.py \
            --from-date ${{ github.event.inputs.from_date || '2026-01-01' }} \
            --to-date ${{ github.event.inputs.to_date || '2026-12-31' }} \
            --out selection_plan.json

      # חד-פעמי: ממיר תוצאות מהפורמט הישן (JSON array) לחדש (JSONL) אם
      # קיים קובץ ישן מהרצות קודמות - לא מזיק להריץ גם כשאין מה להגר.
      - name: Migrate old results format (one-time, safe to always run)
        working-directory: scripts/company_ownership
        run: python migrate_old_results.py

      - name: Run full batch through Gemini (stops gracefully at quota)
        working-directory: scripts/company_ownership
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_MODEL_OVERRIDE: ${{ github.event.inputs.model || (github.event.schedule == '0 10 * * *' && 'gemini-3.5-flash-lite') || 'gemini-3.6-flash' }}
          # D1 sync לדשבורד (שכבת סטטוס). נכשל-בשקט אם חסר - לא קריטי לפייפליין.
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CF_SECURITIES_DB_ID: ${{ vars.CF_SECURITIES_DB_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
          fi
          MODEL="$GEMINI_MODEL_OVERRIDE"
          # קובץ processed_reports נפרד לכל מודל - כל מודל עוקב אחרי
          # ההתקדמות שלו בעצמו, לא חוסמים זה את זה. שני התורים ישתפו
          # את אותו private_subsidiaries.jsonl (עם שדה "model" בכל
          # רשומה כדי לדעת אחר כך מקור כל אחת).
          PROCESSED_LOG="processed_reports_${MODEL//./_}.json"
          echo "מודל: $MODEL | קובץ מעקב: $PROCESSED_LOG"
          python run_full_batch.py --plan selection_plan.json $LIMIT_ARG \
            --processed-log "$PROCESSED_LOG" \
            --workers ${{ github.event.inputs.workers || '2' }} 2>&1 | tee run_log.txt
          exit ${PIPESTATUS[0]}

      # if: always() - קריטי: מחייב את ההתקדמות ל-git גם אם ההרצה
      # נעצרה/נכשלה/נקטעה באמצע. זה מחליף את actions/cache - קבצים
      # שמחויבים ל-git נגישים תמיד, לא תלויים ב-branch שרץ עליו ה-workflow.
      - name: Commit progress to repo
        if: always()
        working-directory: scripts/company_ownership
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # run_log.txt כבר לא נכנס ל-git בכלל (הוצא בכוונה - ראה למטה
          # ובשלב Upload results). זה גם מסיר את סיכון הדליפה (השורה
          # תמיד השתנתה בין הרצות, וזה גרם לקונפליקטים אמיתיים ב-rebase)
          # וגם פותר קונפליקט תוכן קבוע: כל הרצה כותבת לוג שונה, אז
          # git text-merge בין שתי גרסאות שונות תמיד יתנגש בסופו של דבר.
          # מפתח Gemini עדיין מנוקה במקור בתוך extract_subsidiaries.py
          # (לא מסתמכים רק על ניקוי כאן).
          # אם יש commits קיימים שנתקעו עם secrets (מ-checkpoint קודם),
          # עושים squash של הכל ל-commit אחד נקי — מוחק את ההיסטוריה הבעייתית
          UNPUSHED=$(git log --oneline origin/main..HEAD 2>/dev/null | wc -l)
          if [ "$UNPUSHED" -gt 0 ]; then
            echo "$UNPUSHED commits לא-דחופים — עושה squash לנקות secrets מהיסטוריה"
            git reset --soft origin/main
          fi
          # shopt -s nullglob + בדיקת קיום מפורשת - קריטי: "git add" נכשל
          # אטומית (כל הפקודה, exit 128) אם *אחד* מה-pathspecs לא תואם שום
          # קובץ - ולא מסמן בכלל את שאר הקבצים שכן קיימים ותואמים. באג
          # אמיתי שנצפה בפועל: processed_reports.json (בלי סיומת מודל) לא
          # קיים אף פעם בריצה הזו (רק processed_reports_gemini-3_6-flash.json
          # / processed_reports_gemini-3_5-flash-lite.json נוצרים כאן) - אז
          # "git add ... processed_reports.json ..." נכשל תמיד, ה"|| true"
          # בלע את השגיאה בשקט, ושום קובץ לא הצטרף ל-staging - כולל
          # processed_reports_gemini-3_6-flash.json ו-private_subsidiaries.jsonl
          # שכן השתנו בפועל. זה בדיוק מה שגרם ל"אין שינויים לחיוב" השגוי
          # ולאובדן ההתקדמות היומית של gemini-3.6-flash (מכסה נמוכה מדי כדי
          # להגיע אי-פעם ל-checkpoint הפנימי של כל 10 משימות).
          shopt -s nullglob
          FILES=(.maya_cache/*_merged.json selection_plan.json processed_reports_*.json private_subsidiaries.jsonl)
          shopt -u nullglob
          [ -f processed_reports.json ] && FILES+=(processed_reports.json)
          if [ ${#FILES[@]} -gt 0 ]; then
            git add "${FILES[@]}"
          fi
          if git diff --staged --quiet; then
            echo "אין שינויים לחיוב."
          else
            git commit -m "Update extraction progress [skip ci]"
            # retry עם rebase - הרצות ארוכות (שעות) כמעט תמיד יתנגשו עם
            # push אחר שקרה בינתיים (תיקון קוד ידני, או הרצה מקבילה אחרת).
            # לא כלל "אל תדחוף בזמן שרץ" - זה לא יחזיק מעמד, זה תיקון בקוד.
            PUSH_OK=0
            for i in 1 2 3 4 5; do
              if git push; then
                echo "push הצליח (ניסיון $i)."
                PUSH_OK=1
                break
              fi
              echo "push נדחה (ניסיון $i/5) - מושך ועושה rebase..."
              # אם נשאר rebase תקוע מניסיון קודם (למשל קונפליקט או
              # clone רדוד שלא הצליח ליישר היסטוריה) - מבטלים אותו קודם.
              # בלי זה, קריאת rebase נוספת על גבי rebase לא-גמור היא
              # מה שגרם ל"Cannot rebase onto multiple branches".
              git rebase --abort 2>/dev/null || true
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::warning::rebase נכשל (ניסיון $i) - מבטל ומנסה שוב בסיבוב הבא"
                git rebase --abort 2>/dev/null || true
              fi
            done
            if [ "$PUSH_OK" -eq 0 ]; then
              echo "::error::נכשל push אחרי 5 ניסיונות - ההתקדמות לא הגיעה ל-git. נכשל בכוונה כדי שזה לא ידווח כ-success."
              exit 1
            fi
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-results
          path: |
            scripts/company_ownership/selection_plan.json
            scripts/company_ownership/private_subsidiaries.jsonl
            scripts/company_ownership/processed_reports.json
            scripts/company_ownership/run_log.txt
          retention-days: 14

      # מסיר את הלוק תמיד (if: always()) - גם אם הריצה נכשלה/נקטעה/
      # timeout. בלי זה, ריצה שנכשלת משאירה לוק תקוע שחוסם push חיצוני
      # לצמיתות עד שמישהו מסיר ידנית.
      - name: Remove run lock
        if: always()
        working-directory: scripts/company_ownership
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          if [ -f RUNNING_LOCK ]; then
            git rm -f RUNNING_LOCK
            git commit -m "Lock: run ${{ github.run_id }} finished [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                git reset --hard origin/main
                [ -f RUNNING_LOCK ] && { git rm -f RUNNING_LOCK; git commit -m "Lock: run ${{ github.run_id }} finished [skip ci]"; }
              fi
            done
          fi
