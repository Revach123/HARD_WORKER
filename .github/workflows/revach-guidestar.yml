# GuideStar lists for Revach - weekly, here (public repo = free Actions minutes):
#  1. fetch Ottoman associations and public-benefit companies
#     (חל"צ) -> Revach data/registry/*.json
#  2. load the Ottoman associations into company-info-db (hekdeshot now come from the official registry: revach-hekdeshot.yml)
#     (associations table): new numbers are added, rows that came from here are
#     updated; rows from the official registries are never touched.
# Runs on Sunday after Revach's weekly registry load (load-associations, 02:30 UTC).
# Secrets in THIS repo: REVACH_TOKEN, CF_D1_TOKEN, CF_ACCOUNT_ID.
name: Revach - GuideStar lists (Ottoman, PBC)

on:
  schedule:
    - cron: "40 3 * * 0"   # Sunday 03:40 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "load step: count only, write nothing to the DB"
        type: boolean
        default: false

concurrency:
  group: revach-guidestar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guidestar:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash /tmp/q.sh {0}
    timeout-minutes: 90
    steps:
      - name: Quiet logs (public repo - full output stays hidden)
        shell: bash
        run: |
          cat > /tmp/q.sh <<'Q'
          #!/bin/bash
          # מריץ את שלב ה-workflow ושומר את הפלט בקובץ: בהצלחה - רק "ok"; בכשל - 15 השורות האחרונות בלבד
          log=$(mktemp)
          bash --noprofile --norc -eo pipefail "$1" >"$log" 2>&1; c=$?
          if [ $c -eq 0 ]; then echo "ok ($(wc -l <"$log") log lines hidden)"; else echo "failed (exit $c) - last lines:"; tail -n 15 "$log"; fi
          exit $c
          Q
      - uses: actions/checkout@v5
        with:
          repository: Revach123/Revach
          token: ${{ secrets.REVACH_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/registry
            data/registry

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python -u scripts/registry/fetch_guidestar.py ottoman
      - run: python -u scripts/registry/fetch_guidestar.py pbc

      - name: Commit lists to Revach
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry/ottoman_associations.json data/registry/pbc_companies.json data/registry/pbc_ids.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "GuideStar lists ($(date -u +%Y-%m-%d)) (via HARD_WORKER)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          echo "::error::push failed"; exit 1

      - name: Load into the registry DB
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CF_DATABASE_ID: c1d082fc-c125-4f62-8b33-9b62d5bda2da   # company-info-db (public, in HARAV_LEVIN wrangler.toml)
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python -u scripts/registry/load_guidestar.py
