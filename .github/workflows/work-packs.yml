name: Holdings agent - work packs

# חבילות עבודה לסוכן חילוץ ההחזקות (בלי AI): הורדת הדוח השנתי, מיקום החלקים (תקנה 11/12/26, תרשימים, ביאור מוחזקות,
# Exhibit 21), טקסט ותמונות התרשימים. החבילות נדחפות לענף work-packs במאגר Revach (הפרטי). הסוכן לוקח משם.
# סדר: ת"א-35, ת"א-125, ת"א-90, השאר. ר' scripts/company_ownership/work_pack_queue.py.

on:
  workflow_dispatch:
    inputs:
      n:
        description: "כמה חבילות חדשות לבנות"
        required: false
        default: "20"
      rebuild_old:
        description: "קודם לבנות מחדש חבילות מגרסה ישנה של הבונה (true/false)"
        required: false
        default: "true"
      reports:
        description: "report_id מסוימים (מופרדים בפסיק) - במקום סדר העדיפות"
        required: false
        default: ""

concurrency:
  group: work-packs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Revach (site data, read only)
        uses: actions/checkout@v5
        with:
          repository: Revach123/Revach
          token: ${{ secrets.REVACH_TOKEN }}
          path: revach
          sparse-checkout: |
            data/indices/by-company.json
            data/holdings/extracted_subsidiaries.json
            data/registry/maya_companies_full.json
          sparse-checkout-cone-mode: false
      - name: Revach work-packs branch
        env:
          T: ${{ secrets.REVACH_TOKEN }}
        run: |
          # רק ה-manifest של כל חבילה (לדעת מה כבר נבנה) - לא כל התמונות (כמה GB)
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch work-packs "https://x-access-token:${T}@github.com/Revach123/Revach.git" wp \
            && (cd wp && git sparse-checkout set --no-cone 'packs/*/manifest.json' README.md) \
            || { git init -q wp && cd wp && git checkout -q --orphan work-packs && mkdir -p packs \
                 && git remote add origin "https://x-access-token:${T}@github.com/Revach123/Revach.git"; }
      - name: Agent page requests (agent-results/pack-requests)
        env:
          T: ${{ secrets.REVACH_TOKEN }}
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch agent-results "https://x-access-token:${T}@github.com/Revach123/Revach.git" ar \
            && (cd ar && git sparse-checkout set --no-cone 'pack-requests/*' 'redo/*' 'results/*.json' README.md) || mkdir -p ar
          ls ar/pack-requests 2>/dev/null | head -20 || true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install requests pypdf pillow --break-system-packages
          sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Build and push packs (every 50 - a long run that hits the time limit keeps what it built)
        working-directory: scripts/company_ownership
        env:
          GEMINI_API_KEY: "unused"
          PYTHONUNBUFFERED: "1"
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CF_DATABASE_ID: c1d082fc-c125-4f62-8b33-9b62d5bda2da   # company-info-db (company_views)
          N: ${{ github.event.inputs.n || '20' }}
          REPORTS: ${{ github.event.inputs.reports }}
        run: |
          mkdir -p ../../wp/packs
          cd ../../wp && git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com" && cd -
          push() {
            ( cd ../../wp
              git add --sparse packs
              if git diff --cached --quiet; then echo "No new packs."; return 0; fi
              git commit -q -m "work packs: $(git diff --cached --name-only | grep -c manifest.json) reports"
              for i in 1 2 3 4 5; do
                if git push -q origin HEAD:work-packs; then return 0; fi
                git pull -q --rebase origin work-packs || true
                sleep $((i * 5))
              done
              return 1 )
          }
          args="--packs-dir ../../wp/packs --indices ../../revach/data/indices/by-company.json \
            --site ../../revach/data/holdings/extracted_subsidiaries.json --maya ../../revach/data/registry/maya_companies_full.json"
          # בקשות עמודים של סוכנים - קודם לכל: בנייה מחדש של החבילה עם העמודים, ואז redo לדוח ומחיקת הבקשה
          if ls ../../ar/pack-requests/*.json >/dev/null 2>&1; then
            : > /tmp/done_req.txt
            python work_pack_queue.py --n 0 --requests-dir ../../ar/pack-requests --done-requests /tmp/done_req.txt $args
            push || exit 1
            if [ -s /tmp/done_req.txt ]; then
              ( cd ../../ar
                git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
                mkdir -p redo
                while read rid; do
                  printf '{"created_at": "%s", "reason": "pages requested by the agent were added to the pack", "added": "requested_pages in manifest"}\n' \
                    "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "redo/$rid.json"
                  git rm -q --sparse "pack-requests/$rid.json"
                done < /tmp/done_req.txt
                git add --sparse redo
                git commit -q -m "pack requests handled: $(wc -l < /tmp/done_req.txt) packs rebuilt with requested pages -> redo"
                for i in 1 2 3 4 5; do git push -q origin HEAD:agent-results && break; git pull -q --rebase origin agent-results || true; sleep $((i * 5)); done )
            fi
          fi
          if [ -n "$REPORTS" ]; then
            python work_pack_queue.py --n "$N" --reports "$REPORTS" $args
            push; exit $?
          fi
          # חבילות מגרסה ישנה של הבונה - קודם (בלי תרשימים וקטוריים / תמונות טבלאות)
          if [ "${{ github.event.inputs.rebuild_old || 'true' }}" = "true" ]; then
            for round in $(seq 1 20); do
              python work_pack_queue.py --n 50 --rebuild-old --results-dir ../../ar/results $args | tee /tmp/rb.txt
              push || exit 1
              k=$(grep -oE "REBUILD: [0-9]+" /tmp/rb.txt | grep -oE "[0-9]+")
              [ "${k:-0}" -lt 50 ] && break      # סבב אחרון (חבילה שלא ירדה נשארת ישנה - לא לולאה אינסופית)
            done
          fi
          left=$N
          while [ "$left" -gt 0 ]; do
            step=$(( left < 50 ? left : 50 ))
            before=$(ls ../../wp/packs | wc -l)
            python work_pack_queue.py --n "$step" $args
            push || exit 1
            built=$(( $(ls ../../wp/packs | wc -l) - before ))
            [ "$built" -le 0 ] && { echo "Queue empty."; break; }
            left=$(( left - step ))
          done
